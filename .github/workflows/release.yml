name: Release

# Publishes @skrybe/cli to npm.
#
# `npm version` is told not to tag, because tagging and pushing are separate
# steps here — the tag is what triggers this workflow, so it should not fire
# until the bump commit is on main.
#
#   npm version patch --no-git-tag-version   # or minor / major
#   git commit -am 'chore: release 0.1.1'
#   git tag v0.1.1
#   git push origin main --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and validate without publishing'
        type: boolean
        default: true

permissions:
  contents: read
  # Required for npm provenance, which signs the package with this workflow's
  # identity so the npm page links the tarball back to the commit it built
  # from. This works only because the repository is public.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # A tag that disagrees with package.json would publish a version nobody
      # can find from the git history, so refuse rather than guess.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p 'require("./package.json").version')"
          if [ "$tagged" != "$declared" ]; then
            echo "Tag v$tagged does not match package.json version $declared." >&2
            exit 1
          fi

      # `npm publish --dry-run` never contacts the registry, so without this a
      # dry run would pass with a missing, expired or wrongly scoped token and
      # the failure would only surface on a real tag. whoami is the cheapest
      # call that actually authenticates, and it names the account, which
      # catches a token minted from the wrong npm login.
      # whoami proves who the token is, but not what it may do — a read-only
      # token passes it. The scope check is what catches the common failure,
      # because npm answers an unauthorised publish with 404, which reads as
      # "no such package" and sends you looking in the wrong place entirely.
      #
      # A granular token's permissions are fixed when it is created, so a token
      # minted before its owner joined the org cannot have the scope selected,
      # and joining later does not widen it. It has to be reissued.
      - name: Verify the npm credential
        run: |
          echo "Publishing as: $(npm whoami)"
          if npm access list packages @skrybe > /dev/null 2>&1; then
            echo "Token can see the @skrybe scope."
          else
            echo "::warning::This token cannot list @skrybe packages. If the publish fails with E404, that is why: the token needs Read and write on the @skrybe scope, and must have been created after its owner joined the org."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Once 0.1.0 exists on the registry, this token can be replaced with npm
      # trusted publishing: configure the trusted publisher on npmjs.com, drop
      # NODE_AUTH_TOKEN, and pin npm >= 11.5.1 (Node 22 ships 10.9, which has
      # no OIDC support and fails with a 404 that reads like a missing package).
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack only (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run
