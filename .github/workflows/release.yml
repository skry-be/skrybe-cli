name: Release

# Publishes @skrybe/cli to npm using trusted publishing: the runner proves its
# identity to npm over OIDC and is issued a short-lived credential, so there is
# no long-lived token in this repository to leak, rotate or let expire.
#
# This requires a trusted publisher configured on npmjs.com for @skrybe/cli,
# naming this repository and this workflow file.
#
# `npm version` is told not to tag, because tagging and pushing are separate
# steps here — the tag is what triggers this workflow, so it should not fire
# until the bump commit is on main.
#
#   npm version patch --no-git-tag-version   # or minor / major
#   git commit -am 'chore: release 0.1.1'
#   git tag v0.1.1
#   git push origin main --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and validate without publishing'
        type: boolean
        default: true

permissions:
  contents: read
  # The OIDC token trusted publishing exchanges for a publish credential, and
  # what provenance is signed with. Without it npm falls back to looking for a
  # token, finds none, and fails as though the package did not exist.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # A tag that disagrees with package.json would publish a version nobody
      # can find from the git history, so refuse rather than guess.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p 'require("./package.json").version')"
          if [ "$tagged" != "$declared" ]; then
            echo "Tag v$tagged does not match package.json version $declared." >&2
            exit 1
          fi

      # npm below 11.5.1 has no OIDC support at all. It does not say so: it
      # publishes as an anonymous user and the registry answers 404, which
      # reads as "no such package" and sends you looking for the wrong problem
      # entirely. Fail here instead, where the cause is stated.
      - name: Check npm can do OIDC
        run: |
          version="$(npm --version)"
          echo "npm $version"
          required="11.5.1"
          lowest="$(printf '%s\n%s\n' "$version" "$required" | sort -V | head -n1)"
          if [ "$lowest" != "$required" ] && [ "$version" != "$required" ]; then
            echo "npm $version cannot use trusted publishing; $required or newer is required." >&2
            exit 1
          fi

      # No credentials here on purpose. npm performs the OIDC exchange itself
      # when it finds no token and the trusted publisher matches.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish

      - name: Pack only (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run
