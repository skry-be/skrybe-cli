name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from package.json engines, and current LTS. A CLI users
        # install with npx has to run on whatever Node they already have.
        node-version: ['20.19', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Proves the published artifact actually installs and runs, which a plain
      # `npm run build` does not: it catches a bad `files` list, a missing
      # shebang, or a bin path that points at nothing.
      - name: Install the packed tarball and run it
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npm install ./skrybe-cli-*.tgz
          ./node_modules/.bin/skrybe --version
          ./node_modules/.bin/skrybe --help
